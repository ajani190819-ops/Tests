name: Repository Checks

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  orca-and-desktop-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run full repository verification (Orca plugins, Windows apps, .bat contract, docs sync)
        run: python3 tools/check_all.py

  windows-desktop-compile:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile C# sources with stock Windows Framework64 csc.exe & parse all PowerShell ASTs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = "$env:WinDir\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          foreach ($target in @(
              'keyboard-lighting\ui_controls.cs.txt',
              'bluetooth-guard\BluetoothCore.cs',
              'project-hub\HubCore.cs'
          )) {
              $out = Join-Path $env:TEMP ([IO.Path]::GetFileNameWithoutExtension($target) + '.dll')
              & $csc /nologo /target:library /optimize+ /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll "/out:$out" $target
              if ($LASTEXITCODE -ne 0) { throw "csc failed on $target" }
          }
          foreach ($ps in Get-ChildItem -Recurse -Filter '*.ps1') {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($ps.FullName, [ref]$tokens, [ref]$errors)
              if ($errors -and $errors.Count -gt 0) {
                  throw ("PowerShell parse error in {0}: {1}" -f $ps.FullName, ($errors | Out-String))
              }
          }
